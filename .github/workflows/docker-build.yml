name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            cybercreeper/8byte-devops-app:latest
            cybercreeper/8byte-devops-app:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull cybercreeper/8byte-devops-app:${{ github.sha }}

            docker stop 8byte-staging-app || true
            docker rm 8byte-staging-app || true

            docker run -d \
              --name 8byte-staging-app \
              --restart unless-stopped \
              -p 5000:5000 \
              cybercreeper/8byte-devops-app:${{ github.sha }}

            sleep 5

            curl --fail http://localhost:5000/health